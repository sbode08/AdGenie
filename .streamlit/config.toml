[theme]
primaryColor = "#667eea"
backgroundColor = "#0a0e27"
secondaryBackgroundColor = "#16213e"
textColor = "#ffffff"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
maxUploadSize = 200
headless = true
port = 8501
enableXsrfProtection = true

[logger]
level = "info"
