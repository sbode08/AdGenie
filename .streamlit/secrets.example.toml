# STREAMLIT CLOUD DEPLOYMENT - SECRETS TEMPLATE
# Copy the values below and add them to Streamlit Cloud Settings → Secrets
# (NOT in this file - this is just a template)

# OpenRouter API Key
# Get from: https://openrouter.ai/keys
OPENROUTER_API_KEY = "sk-or-v1-YOUR_KEY_HERE"

# Demo mode - set to "true" for demo with test account, "false" for production
DEMO_MODE = "false"

# Stripe Settings - Get from https://dashboard.stripe.com/
# Use LIVE keys for production, TEST keys for development
STRIPE_SECRET_KEY = "sk_live_YOUR_KEY_HERE"

# Stripe Price IDs - Create products in Stripe dashboard
# https://dashboard.stripe.com/products
STRIPE_BASIC_PRICE_ID = "price_1YOUR_BASIC_ID"
STRIPE_PRO_PRICE_ID = "price_1YOUR_PRO_ID"

# Your app URL - Update this to your Streamlit Cloud URL
# Format: https://your-app-name.streamlit.app
APP_URL = "https://your-app-name.streamlit.app"

# Optional: Social Media API Keys (if implementing social posting)
TIKTOK_API_KEY = "your_tiktok_api_key_here"
TIKTOK_ACCESS_TOKEN = "your_tiktok_access_token_here"
INSTAGRAM_ACCESS_TOKEN = "your_instagram_access_token_here"
LINKEDIN_ACCESS_TOKEN = "your_linkedin_access_token_here"
